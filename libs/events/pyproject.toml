[project]
name = "sfo-events"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "sfo-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfo_events"]

[tool.uv.sources]
sfo-common = { workspace = true }
