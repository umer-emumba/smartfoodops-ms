[project]
name = "sfo-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "uuid-utils>=0.9",
]

[project.optional-dependencies]
# sfo_common.temporal — only the services that run a Temporal worker need it.
temporal = ["temporalio>=1.34", "sfo-contracts"]
# sfo_common.celery — only the services that run a Celery worker need it.
celery = ["celery>=5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfo_common"]

[tool.uv.sources]
sfo-contracts = { workspace = true }
