[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "fastapi-limiter>=0.1.6,<0.2",
    "pyjwt>=2.9",
    "sfo-common",
    "sfo-observability",
    "sfo-auth",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
sfo-common = { workspace = true }
sfo-observability = { workspace = true }
sfo-auth = { workspace = true }
