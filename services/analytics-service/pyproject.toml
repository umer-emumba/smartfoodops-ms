[project]
name = "analytics-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Native async client (AsyncMongoClient) — replaces the deprecated Motor.
    "pymongo>=4.13",
    "prometheus-client>=0.21",
    "sfo-common",
    "sfo-auth",
    "sfo-events",
    "sfo-observability",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
sfo-common = { workspace = true }
sfo-auth = { workspace = true }
sfo-events = { workspace = true }
sfo-observability = { workspace = true }
