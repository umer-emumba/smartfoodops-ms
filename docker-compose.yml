name: smartfoodops

x-postgres-common: &postgres-common
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  # ---------- Infra: per-service Postgres (database-per-service, see docs/architecture.md) ----------
  user-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    volumes: ["user-db-data:/var/lib/postgresql/data"]

  restaurant-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    volumes: ["restaurant-db-data:/var/lib/postgresql/data"]

  order-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    volumes: ["order-db-data:/var/lib/postgresql/data"]

  delivery-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery_db
    volumes: ["delivery-db-data:/var/lib/postgresql/data"]

  payment-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    volumes: ["payment-db-data:/var/lib/postgresql/data"]

  notification-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    volumes: ["notification-db-data:/var/lib/postgresql/data"]

  temporal-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal
    volumes: ["temporal-db-data:/var/lib/postgresql/data"]

  # ---------- Infra: shared stores/brokers ----------
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["127.0.0.1:15672:15672"] # management UI (localhost only)

  kafka:
    # bitnami/kafka was pulled from the free Docker Hub catalog after this
    # compose file was first written (Bitnami moved older free tags behind a
    # paywall) — confluentinc/cp-kafka, version-matched to schema-registry
    # below, replaces it: same vendor/release train as an already-used image,
    # actively maintained, no free-tier ambiguity.
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single-broker dev cluster — Confluent's defaults (replication factor 3)
      # would otherwise fail to ever reach "healthy" with only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed, valid-format KRaft cluster ID — the same literal Confluent's own
      # quickstart docs use for single-node local dev; any valid base64 UUID
      # works, but pinning one keeps `docker compose down -v && up` reproducible.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: temporal-db

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8088:8080"] # no auth — localhost only

  # ---------- App services ----------
  # No Traefik / reverse proxy in front of api-gateway here, deliberately —
  # gateway HA (multiple replicas + load balancing) is a Kubernetes-deployment
  # concern (Service + Deployment/HPA), not something a single dev laptop can
  # meaningfully demonstrate. See docs/technical-documentation.md#gateway-single-entry-point-not-a-spof.
  api-gateway:
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    env_file: [services/api-gateway/.env]
    depends_on:
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    env_file: [services/user-service/.env]
    depends_on:
      user-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  restaurant-service:
    build: { context: ., dockerfile: services/restaurant-service/Dockerfile }
    env_file: [services/restaurant-service/.env]
    depends_on:
      restaurant-db: { condition: service_healthy }
      # Public-read cache (app/cache.py). Not strictly required — a Redis
      # outage only means cache misses — but start with it available.
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    env_file: [services/order-service/.env]
    depends_on:
      order-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-service:
    build: { context: ., dockerfile: services/delivery-service/Dockerfile }
    env_file: [services/delivery-service/.env]
    depends_on:
      delivery-db: { condition: service_healthy }
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    env_file: [services/payment-service/.env]
    depends_on:
      payment-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    env_file: [services/notification-service/.env]
    depends_on:
      notification-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user-db-data:
  restaurant-db-data:
  order-db-data:
  delivery-db-data:
  payment-db-data:
  notification-db-data:
  temporal-db-data:
  mongo-data:
  kafka-data:
