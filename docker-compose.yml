name: smartfoodops

# Every container logs JSON to stdout; Docker's json-file driver stores it on
# the host. Without these options those files grow forever — rotate at 10 MB,
# keep 3. (A collector like Loki/Grafana reads the same stream in Week 3.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Celery workers (docs/week3-plan.md W3-D1, W3-D7) — the outbox relays and
# notification sending: the service's own image, running Celery (worker +
# beat) instead of the API. They start after their service is healthy, i.e.
# after its migrations ran. Dev-only broker credentials, like the Postgres
# ones below.
# Observability (docs/week3-plan.md W3-D11, W3-D14): every service and
# worker sends spans over OTLP/HTTP straight to Jaeger (sampling everything
# in dev) and serves Prometheus metrics on an internal port — 9100, plus
# 9101 for the Temporal SDK's where a Temporal worker runs. Neither port is
# published.
x-observability-env: &observability-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  METRICS_PORT: "9100"
  TEMPORAL_METRICS_PORT: "9101"

x-broker-env: &broker-env
  <<: *observability-env
  CELERY_BROKER_URL: amqp://sfo:sfo@rabbitmq:5672//

x-celery-worker: &celery-worker
  logging: *default-logging
  command:
    - celery
    - -A
    - app.celery_app
    - worker
    - --beat
    - --pool=solo
    # Both rely on remote control, which is off (sfo_common.celery).
    - --without-mingle
    - --without-gossip
    - --loglevel=INFO
  environment: *broker-env

x-postgres-common: &postgres-common
  logging: *default-logging
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  # ---------- Infra: per-service Postgres (database-per-service, see docs/architecture.md) ----------
  user-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    volumes: ["user-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15432:5432"]

  restaurant-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    volumes: ["restaurant-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15433:5432"]

  order-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    volumes: ["order-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15434:5432"]

  delivery-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery_db
    volumes: ["delivery-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15435:5432"]

  payment-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    volumes: ["payment-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15436:5432"]

  notification-db:
    <<: *postgres-common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    volumes: ["notification-db-data:/var/lib/postgresql/data"]
    # Host access for the real-DB tests (scripts/check.sh --with-db), localhost only.
    ports: ["127.0.0.1:15437:5432"]

  # ---------- Infra: shared stores/brokers ----------
  mongo:
    logging: *default-logging
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    # Host access for analytics-service's db tests, localhost only.
    ports: ["127.0.0.1:27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    # Persistent: the JWT deny-list (revoked tokens) and rate-limit counters
    # must survive a restart. AOF fsynced every second — at most ~1s of writes
    # lost on a crash; caches and live rider positions rebuild on their own.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis-data:/data"]
    # Host access for the real-Redis tests (scripts/check.sh --with-db,
    # Redis DB 15), localhost only.
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    logging: *default-logging
    # 4.3: the community-supported series (3.13 is commercial-support only).
    # Pinned to a patch so builds are reproducible.
    image: rabbitmq:4.3.6-management-alpine
    # The default `guest` user may only connect from localhost, so the
    # workers get their own (dev-only) user.
    environment:
      RABBITMQ_DEFAULT_USER: sfo
      RABBITMQ_DEFAULT_PASS: sfo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["127.0.0.1:15672:15672"] # management UI (localhost only)

  kafka:
    logging: *default-logging
    # bitnami/kafka was pulled from the free Docker Hub catalog after this
    # compose file was first written (Bitnami moved older free tags behind a
    # paywall) — confluentinc/cp-kafka, version-matched to schema-registry
    # below, replaces it: same vendor/release train as an already-used image,
    # actively maintained, no free-tier ambiguity. 8.x (Kafka 4.x, KRaft only —
    # this config already was) replaces 7.7, whose standard support ended
    # 2026-07-26.
    image: confluentinc/cp-kafka:8.3.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single-broker dev cluster — Confluent's defaults (replication factor 3)
      # would otherwise fail to ever reach "healthy" with only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed, valid-format KRaft cluster ID — the same literal Confluent's own
      # quickstart docs use for single-node local dev; any valid base64 UUID
      # works, but pinning one keeps `docker compose down -v && up` reproducible.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    logging: *default-logging
    # One-shot: creates the topics explicitly instead of relying on
    # auto-create (week3-plan W3-D15) — 3 partitions each (keyed by aggregate
    # ID, so consumers can scale out to 3), 7-day retention. Idempotent
    # (--if-not-exists); exits 0 when done. Workers depend on it completing.
    image: confluentinc/cp-kafka:8.3.2
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in order-events delivery-events payment-events; do
          for name in "$$topic" "$$topic.dlq"; do
            kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
              --topic "$$name" --partitions 3 --replication-factor 1 \
              --config retention.ms=604800000
          done
        done
        kafka-topics --bootstrap-server kafka:9092 --describe \
          --topic 'order-events|delivery-events|payment-events' --exclude-internal

  schema-registry:
    logging: *default-logging
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      # The 8.x image ships python3 but no curl.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects')"
      interval: 10s
      timeout: 5s
      retries: 10

  # Traces (week3-plan W3-D11): Jaeger v2 — itself an OpenTelemetry
  # Collector distribution, so services export OTLP to it directly. The
  # default all-in-one config keeps traces in memory (lost on restart),
  # which is what dev needs. UI on localhost only; OTLP stays internal.
  jaeger:
    logging: *default-logging
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]

  # Metrics, dashboards and logs (docs/week3-plan.md step 5). UIs on
  # localhost only: Prometheus :9090, Grafana :3001 (anonymous read-only
  # viewer in dev; admin/admin to edit). Loki and Alloy stay internal.
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  loki:
    logging: *default-logging
    # Single-binary mode with the image's own local config (filesystem
    # storage, schema v13 — structured metadata for trace_id).
    image: grafana/loki:3.7.8
    volumes: ["loki-data:/loki"]

  # Ships every container's logs to Loki (infra/alloy/config.alloy). The
  # Docker socket is mounted read-only — local development only.
  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    logging: *default-logging
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
      GF_FEATURE_TOGGLES_ENABLE: jaegerEnableGrpcEndpoint
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 3001 on the host: 3000 is the demo UI's static server (demo-ui/).
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki, jaeger]

  temporal:
    logging: *default-logging
    # Temporal CLI dev server — Temporal's recommended local setup, replacing the
    # deprecated temporalio/auto-setup image (plus its own Postgres and a
    # separate UI container). One process: frontend on :7233, web UI on :8233,
    # state in SQLite on a volume so workflows survive restarts. Production
    # would run temporalio/server against a real database (or Temporal Cloud).
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
      # Server metrics for Prometheus (internal network only).
      - --metrics-port=9100
    # Mounted on the image's own temporal-owned home dir: the container runs as
    # the non-root `temporal` user, and a fresh named volume takes the
    # ownership of the directory it's mounted over (a new /data would be
    # root-owned and SQLite couldn't create its file).
    volumes: ["temporal-data:/home/temporal"]
    ports: ["127.0.0.1:8088:8233"] # web UI, no auth — localhost only
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- App services ----------
  # No Traefik / reverse proxy in front of api-gateway here, deliberately —
  # gateway HA (multiple replicas + load balancing) is a Kubernetes-deployment
  # concern (Service + Deployment/HPA), not something a single dev laptop can
  # meaningfully demonstrate. See docs/technical-documentation.md#gateway-single-entry-point-not-a-spof.
  api-gateway:
    logging: *default-logging
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    env_file: [services/api-gateway/.env]
    environment: *observability-env
    depends_on:
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    env_file: [services/user-service/.env]
    environment: *observability-env
    # The token-signing private key: only this service gets it. Everyone else
    # verifies with the public keys it serves at /.well-known/jwks.json.
    # The additional public keys are the next/previous key during a rotation.
    secrets: [jwt_private_key, jwt_additional_public_keys]
    depends_on:
      user-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  restaurant-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/restaurant-service/Dockerfile }
    env_file: [services/restaurant-service/.env]
    environment: *observability-env
    depends_on:
      restaurant-db: { condition: service_healthy }
      # Public-read cache (app/cache.py). Not strictly required — a Redis
      # outage only means cache misses — but start with it available.
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    env_file: [services/order-service/.env]
    environment: *observability-env
    depends_on:
      order-db: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/delivery-service/Dockerfile }
    env_file: [services/delivery-service/.env]
    environment: *observability-env
    depends_on:
      delivery-db: { condition: service_healthy }
      mongo: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    env_file: [services/payment-service/.env]
    environment: *observability-env
    depends_on:
      payment-db: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Start order: this worker waits for its API (so migrations have run),
  # the DB, RabbitMQ (Celery broker), Schema Registry, and kafka-init (topics
  # exist). Same image as the API, but runs Celery: the outbox relay (beat)
  # publishes outbox rows to Kafka.
  order-worker:
    <<: *celery-worker
    environment:
      <<: *broker-env
      OTEL_SERVICE_NAME: order-worker
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    env_file: [services/order-service/.env]
    depends_on:
      order-service: { condition: service_healthy }
      order-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment-worker:
    <<: *celery-worker
    environment:
      <<: *broker-env
      OTEL_SERVICE_NAME: payment-worker
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    env_file: [services/payment-service/.env]
    depends_on:
      payment-service: { condition: service_healthy }
      payment-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  delivery-worker:
    <<: *celery-worker
    environment:
      <<: *broker-env
      OTEL_SERVICE_NAME: delivery-worker
    build: { context: ., dockerfile: services/delivery-service/Dockerfile }
    env_file: [services/delivery-service/.env]
    depends_on:
      delivery-service: { condition: service_healthy }
      delivery-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # Live feeds over SSE (docs/week2-plan.md D8): stateless, talks only to
  # Redis — no database. Long-lived connections stay off the REST services.
  tracking-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/tracking-service/Dockerfile }
    env_file: [services/tracking-service/.env]
    environment: *observability-env
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    env_file: [services/notification-service/.env]
    # The Kafka consumer runs in this process (KAFKA_CONSUMER_MODE=embedded)
    # and enqueues sends on RabbitMQ.
    environment: *broker-env
    depends_on:
      notification-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Analytics read model (docs/week3-plan.md step 3): consumes every topic
  # and DLQ into Mongo; no Postgres, so no migrations.
  analytics-service:
    logging: *default-logging
    build: { context: ., dockerfile: services/analytics-service/Dockerfile }
    env_file: [services/analytics-service/.env]
    environment: *observability-env
    depends_on:
      mongo: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-worker:
    <<: *celery-worker
    environment:
      <<: *broker-env
      OTEL_SERVICE_NAME: notification-worker
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    env_file: [services/notification-service/.env]
    depends_on:
      notification-service: { condition: service_healthy }
      notification-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

# Dev-only: a file on the host (scripts/gen_jwt_key.py creates it, git-ignored).
# Real deployments use a secrets manager instead.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_additional_public_keys:
    file: ./secrets/jwt_additional_public_keys.pem

volumes:
  user-db-data:
  restaurant-db-data:
  order-db-data:
  delivery-db-data:
  payment-db-data:
  notification-db-data:
  temporal-data:
  redis-data:
  mongo-data:
  kafka-data:
  prometheus-data:
  loki-data:
  grafana-data:
